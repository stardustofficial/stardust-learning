        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
        .badge-tailor { background: #dbeafe; color: #1e40af; }
        .badge-grocery { background: #d1fae5; color: #065f46; }

        // 1. TYPES & SCHEMA

        const STORAGE_KEYS = {
            SHOPS: 'saas_shops',
            USERS: 'saas_users',
            CUSTOMERS: 'saas_customers',
            ORDERS: 'saas_orders',
            PAYMENTS: 'saas_payments',
            ACTIVITY_LOGS: 'saas_activity_logs',
            APP_STATE: 'saas_app_state',
            SETTINGS: 'saas_settings',
        };

        // ============================================================
        // 2. STORAGE MANAGER
        // ============================================================
        class StorageManager {
            constructor(key) { this.key = key; }
            getAll() { try { const data = localStorage.getItem(this.key); return data ? JSON.parse(data) : []; } catch { return []; } }
            getById(id) { return this.getAll().find(item => item.id === id) || null; }
            create(item) { const items = this.getAll(); const newItem = { ...item, id: this._generateId() }; items.push(newItem);
                this._save(items); return newItem; }
            update(id, updates) { const items = this.getAll(); const index = items.findIndex(item => item.id === id); if (index ===
                    -1) return null; items[index] = { ...items[index], ...updates, updatedAt: new Date().toISOString() };
                this._save(items); return items[index]; }
            delete(id) { const items = this.getAll(); const filtered = items.filter(item => item.id !== id); if (filtered.length ===
                    items.length) return false; this._save(filtered); return true; }
            getByShopId(shopId) { return this.getAll().filter(item => item.shopId === shopId); }
            _save(items) { try { localStorage.setItem(this.key, JSON.stringify(items)); } catch (e) { console.error('Storage error:',
                        e); } }
            _generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
        }

        const shopStorage = new StorageManager(STORAGE_KEYS.SHOPS);
        const userStorage = new StorageManager(STORAGE_KEYS.USERS);
        const customerStorage = new StorageManager(STORAGE_KEYS.CUSTOMERS);
        const orderStorage = new StorageManager(STORAGE_KEYS.ORDERS);
        const paymentStorage = new StorageManager(STORAGE_KEYS.PAYMENTS);
        const activityStorage = new StorageManager(STORAGE_KEYS.ACTIVITY_LOGS);

        const appStateStorage = {
            getState() { try { const data = localStorage.getItem(STORAGE_KEYS.APP_STATE); return data ? JSON.parse(data) : {
                        currentShopId: null, currentUser: null }; } catch { return { currentShopId: null, currentUser: null }; } },
            setState(state) { const current = this.getState(); const updated = { ...current, ...state };
                localStorage.setItem(STORAGE_KEYS.APP_STATE, JSON.stringify(updated)); },
            clear() { localStorage.removeItem(STORAGE_KEYS.APP_STATE); }
        };

        const settingsStorage = {
            get() { try { const data = localStorage.getItem(STORAGE_KEYS.SETTINGS); return data ? JSON.parse(data) : { language: 'en' }; } catch { return { language: 'en' }; } },
            set(settings) { localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(settings)); }
        };

        // ============================================================
        // 3. HELPERS
        // ============================================================
        function generateOrderNumber(shopId) {
            const orders = orderStorage.getByShopId(shopId);
            const count = orders.length + 1;
            const d = new Date();
            const year = d.getFullYear().toString().slice(-2);
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            return `ORD-${year}${month}-${count.toString().padStart(4, '0')}`;
        }

        function logActivity(shopId, userId, action, details) {
            activityStorage.create({ shopId, userId, action, details, timestamp: new Date().toISOString() });
        }

        function getCustomerByMobile(mobile, shopId) {
            return customerStorage.getByShopId(shopId).find(c => c.mobile === mobile) || null;
        }

        function searchCustomers(query, shopId) {
            const q = query.toLowerCase();
            return customerStorage.getByShopId(shopId).filter(c =>
                c.name.toLowerCase().includes(q) ||
                c.mobile.includes(query) ||
                (c.email && c.email.toLowerCase().includes(q))
            );
        }

        // ============================================================
        // 6. REACT-LIKE RENDER ENGINE
        // ============================================================
        let appState = appStateStorage.getState();
        let appListeners = [];

        function setAppState(newState) {
            appState = { ...appState, ...newState };
            appStateStorage.setState(appState);
            appListeners.forEach(fn => fn());
        }

        function subscribe(listener) {
            appListeners.push(listener);
            return () => { appListeners = appListeners.filter(fn => fn !== listener); };
        }

        let currentRoute = '/login';
        const routerListeners = [];

        function navigate(route) {
            currentRoute = route;
            routerListeners.forEach(fn => fn());
            window.history.pushState({}, '', route);
        }

        function onRouteChange(fn) {
            routerListeners.push(fn);
            return () => { routerListeners = routerListeners.filter(f => f !== fn); };
        }

        window.addEventListener('popstate', () => {
            currentRoute = window.location.pathname;
            routerListeners.forEach(fn => fn());
        });

        function rerender() {
            clearTimeout(window._rerenderTimeout);
            window._rerenderTimeout = setTimeout(() => {
                renderRoute();
            }, 10);
        }

        // ---- Shop Switcher ----
        function ShopSwitcher() {
            const shops = shopStorage.getAll();
            const currentShop = shops.find(s => s.id === appState.currentShopId);
            let isOpen = false;

            const container = document.createElement('div');
            container.className = 'relative';

            const btn = document.createElement('button');
            btn.className =
                'flex items-center space-x-2 px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors text-sm';
            const industry = currentShop?.industry || 'business';
            const config = industryConfigs[industry] || industryConfigs.business;
            btn.innerHTML = `
                <i class="fas ${config.icon} text-gray-600"></i>
                <span class="font-medium text-gray-700">${currentShop?.name || t('selectShop')}</span>
                <i class="fas fa-chevron-down text-gray-400 text-xs"></i>
            `;
            btn.onclick = () => { isOpen = !isOpen;
                rerender(); };
            container.appendChild(btn);

            if (isOpen) {
                const dropdown = document.createElement('div');
                dropdown.className =
                'absolute top-full left-0 mt-1 w-64 bg-white rounded-lg shadow-lg border border-gray-200 z-20';
                const list = document.createElement('div');
                list.className = 'p-2';

                shops.forEach(shop => {
                    const config = industryConfigs[shop.industry] || industryConfigs.business;
                    const item = document.createElement('button');
                    item.className =
                        `w-full flex items-center space-x-2 px-3 py-2 rounded-lg text-sm transition-colors ${shop.id === appState.currentShopId ? 'bg-indigo-50 text-indigo-700' : 'hover:bg-gray-100 text-gray-700'}`;
                    item.innerHTML = `
                        <i class="fas ${config.icon}"></i>
                        <span class="flex-1 text-left">${shop.name}</span>
                        <span class="text-xs ${config.badge}">${config.label}</span>
                        ${shop.id === appState.currentShopId ? '<span class="text-xs text-indigo-600">Active</span>' : ''}
                    `;
                    item.onclick = () => {
                        setAppState({ currentShopId: shop.id });
                        isOpen = false;
                        rerender();
                    };
                    list.appendChild(item);
                });

                dropdown.appendChild(list);
                container.appendChild(dropdown);

                const closeHandler = (e) => {
                    if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                        isOpen = false;
                        rerender();
                        document.removeEventListener('click', closeHandler);
                    }
                };
                setTimeout(() => document.addEventListener('click', closeHandler), 0);
            }

            return container;
        }

                if (sidebarSS) { const ss = ShopSwitcher();

                        sb.classList.toggle('translate-x-0');
                        sb.classList.toggle('-translate-x-full');

                document.querySelectorAll('#sidebar nav a').forEach(a => {

        // ---- Industry-Specific Dashboard ----
        function DashboardPage() {
            const shopId = appState.currentShopId;

            const industry = shop?.industry || 'business';
            const config = industryConfigs[industry] || industryConfigs.business;

            const customers = customerStorage.getByShopId(shopId);
            const orders = orderStorage.getByShopId(shopId);
            const payments = paymentStorage.getAll().filter(p => orders.some(o => o.id === p.orderId));
            const totalRevenue = payments.reduce((sum, p) => sum + p.amount, 0);
            const pendingOrders = orders.filter(o => o.status === 'pending').length;

            // Industry-specific stats
            let stats = [
                { label: t('totalCustomers'), value: customers.length, icon: 'fa-users', color: 'bg-blue-500' },
                { label: t('totalOrders'), value: orders.length, icon: 'fa-box', color: 'bg-purple-500' },
                { label: t('pendingOrders'), value: pendingOrders, icon: 'fa-clock', color: 'bg-yellow-500' },
                { label: t('totalRevenue'), value: `₹${totalRevenue.toLocaleString()}`, icon: 'fa-chart-line',
                    color: 'bg-green-500' },
            ];

            // Grocery specific stats
            if (industry === 'grocery') {
                const totalStock = orders.reduce((sum, o) => {
                    const items = o.items || [];
                    return sum + items.reduce((s, item) => s + (item.quantity || 0), 0);
                }, 0);
                stats.push({ label: 'Total Stock', value: totalStock, icon: 'fa-cubes', color: 'bg-orange-500' });

            // Tailor specific stats

                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">${t('advancePayment')} (₹)</label>
                                    <input type="number" id="ofAdvance" min="0" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">${t('totalAmount')} (₹)</label>
                                    <input type="number" id="ofTotal" min="0" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">${t('targetDelivery')} *</label>
                                    <input type="date" id="ofDelivery" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">${t('deliveryAddress')}</label>
                                    <input type="text" id="ofAddress" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="${t('deliveryAddress')}">
                                </div>
                            </div>

                            <div class="flex space-x-3 pt-4 border-t border-gray-200">
                                <button type="button" onclick="document.getElementById('orderFormModal').remove()" class="flex-1 px-4 py-2.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium">
                                    ${t('cancel')}
                                </button>
                                <button type="submit" class="flex-1 px-4 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">
                                    ${t('createOrder')}
                                </button>
                            </div>

                    </div>
                `;

                overlay.innerHTML = html;

                // Set default delivery date
                const deliveryInput = document.getElementById('ofDelivery');
                if (deliveryInput) {
                    deliveryInput.value = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                }

                // Auto-fill address from customer
                document.getElementById('ofCustomer')?.addEventListener('change', function() {
                    const customer = customers.find(c => c.id === this.value);
                    if (customer && customer.address) {
                        document.getElementById('ofAddress').value = customer.address;
                    }
                });

                // Add item
                document.getElementById('ofAddItem')?.addEventListener('click', function() {
                    const name = document.getElementById('ofItemName').value.trim();
                    const qty = parseInt(document.getElementById('ofItemQty').value) || 1;
                    const price = parseFloat(document.getElementById('ofItemPrice').value) || 0;
                    if (name && qty > 0 && price > 0) {
                        const item = { id: Date.now().toString(), name, quantity: qty, price, total: qty * price };
                        formState.items.push(item);
                        formState.totalAmount += item.total;
                        updateItemsUI();
                        document.getElementById('ofItemName').value = '';
                        document.getElementById('ofItemPrice').value = '';
                        document.getElementById('ofTotal').value = formState.totalAmount;
                    }
                });

                function updateItemsUI() {
                    const list = document.getElementById('ofItemsList');
                    if (!list) return;
                    list.innerHTML = formState.items.map(item => `
                        <div class="bg-gray-100 rounded-lg px-3 py-1.5 flex items-center space-x-2 text-sm">
                            <span>${item.name} × ${item.quantity} = ₹${item.total}</span>
                            <button type="button" onclick="removeOrderItem('${item.id}')" class="text-red-500 hover:text-red-700">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    `).join('');
                }

                window.removeOrderItem = function(id) {
                    const item = formState.items.find(i => i.id === id);
                    if (item) {
                        formState.totalAmount -= item.total;
                        formState.items = formState.items.filter(i => i.id !== id);
                        updateItemsUI();
                        document.getElementById('ofTotal').value = formState.totalAmount;
                    }
                };

                // Form submit
                document.getElementById('orderForm')?.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const customerId = document.getElementById('ofCustomer').value;
                    const specs = document.getElementById('ofSpecs').value;
                    const advance = parseFloat(document.getElementById('ofAdvance').value) || 0;
                    const total = parseFloat(document.getElementById('ofTotal').value) || 0;
                    const delivery = document.getElementById('ofDelivery').value;
                    const address = document.getElementById('ofAddress').value;

                    if (!customerId || !delivery || formState.items.length === 0) {
                        alert('Please fill in all required fields and add at least one item');
                        return;
                    }

                    // Collect measurements for tailor
                    const measurements = {};
                    document.querySelectorAll('.measurement-input').forEach(inp => {
                        if (inp.value.trim()) {
                            measurements[inp.dataset.key] = inp.value.trim();
                        }
                    });

                    // Collect extra fields
                    let extraData = {};
                    if (industry === 'tailor') {
                        extraData = {
                            fabricType: document.getElementById('ofFabric')?.value || '',
                            color: document.getElementById('ofColor')?.value || '',
                            design: document.getElementById('ofDesign')?.value || '',
                            stitchingType: document.getElementById('ofStitching')?.value || '',
                        };
                    } else if (industry === 'grocery') {
                        extraData = {
                            productName: document.getElementById('ofProduct')?.value || '',
                            weight: parseFloat(document.getElementById('ofWeight')?.value) || 0,
                        };
                    }

                    const orderData = {
                        customerId,
                        shopId: appState.currentShopId,
                        industry: industry,
                        category: industry === 'tailor' ? 'Tailoring' : industry === 'grocery' ? 'Grocery' : 'General',
                        measurements,
                        specifications: specs,
                        advancePayment: advance,
                        totalAmount: total,
                        items: formState.items,
                        status: 'pending',
                        targetDeliveryDate: delivery,
                        deliveryAddress: address || 'N/A',
                        createdBy: appState.currentUser?.id || '',
                        remainingAmount: total - advance,
                        paymentStatus: advance >= total ? 'paid' : 'pending',
                        orderNumber: generateOrderNumber(appState.currentShopId),
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString(),
                        ...extraData,
                    };

                    const order = orderStorage.create(orderData);

                    if (advance > 0) {
                        paymentStorage.create({
                            orderId: order.id,
                            amount: advance,
                            method: 'cash',
                            receivedBy: appState.currentUser?.id || '',
                            createdAt: new Date().toISOString(),
                        });
                    }

                    logActivity(appState.currentShopId, appState.currentUser?.id || '', 'order_created',
                        `Order ${order.orderNumber} created`);

                    document.getElementById('orderFormModal').remove();
                    rerender();
                });
            }

            renderForm();
            document.body.appendChild(overlay);
            return overlay;
        }

        // ============================================================
        // 9. ROUTER
        // ============================================================
        function getCurrentRoute() {
            const path = window.location.pathname;
            if (path === '/') return '/dashboard';
            return path || '/login';
        }

        function renderRoute() {
            const route = getCurrentRoute();

            const isLoggedIn = appState.currentUser && appState.currentShopId;
            const publicRoutes = ['/login'];

            if (!isLoggedIn && !publicRoutes.includes(route)) {
                navigate('/login');
                return renderPage(LoginPage);
            }

            if (isLoggedIn && route === '/login') {
                navigate('/dashboard');
                return renderRoute();
            }

            let page;
            switch (route) {
                case '/dashboard':
                    page = DashboardPage();
                    break;
                case '/customers':
                    page = CustomersPage();
                    break;
                case '/orders':
                    page = OrdersPage();
                    break;
                case '/payments':
                    page = PaymentsPage();
                    break;
                case '/settings':
                    page = SettingsPage();
                    break;
                case '/login':
                    page = LoginPage();
                    break;
                default:
                    page = NotFoundPage();
            }

            if (isLoggedIn && route !== '/login') {
                const titles = {
                    '/dashboard': t('dashboard'),
                    '/customers': t('customers'),
                    '/orders': t('orders'),
                    '/payments': t('payments'),
                    '/settings': t('settings'),
                };
                const layout = Layout({ children: page, title: titles[route] || 'Page' });
                return renderPage(() => layout);
            }

            return renderPage(() => page);
        }

        function renderPage(component) {
            const app = document.getElementById('app');
            app.innerHTML = '';
            const el = component();
            app.appendChild(el);
            return el;
        }

        // ============================================================
        // 10. GLOBAL FUNCTIONS
        // ============================================================
        window.handleLogout = function() {
            appStateStorage.clear();
            appState = { currentShopId: null, currentUser: null };
            navigate('/login');
            rerender();
        };

        window.navigate = navigate;

        // ============================================================
        // 11. INIT
        // ============================================================
        // Subscribe to state changes
        subscribe(() => { rerender(); });

        // Route changes
        onRouteChange(() => { rerender(); });

        // Initial route
        const initialPath = window.location.pathname;
        currentRoute = initialPath && initialPath !== '/' ? initialPath : '/login';

        // Check if user is already logged in
        const savedState = appStateStorage.getState();
        if (savedState.currentUser && savedState.currentShopId) {
            appState = savedState;
            if (currentRoute === '/login') {
                currentRoute = '/dashboard';
            }
        }

        // Initialize app
        renderRoute();

        console.log('📦 Data stored in localStorage');

        console.log('🏪 Businesses: Tailor, Grocery, General Business');
