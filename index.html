        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        .modal-overlay { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-in-progress { background: #dbeafe; color: #1e40af; }
        .status-ready { background: #d1fae5; color: #065f46; }
        .status-delivered { background: #f3f4f6; color: #374151; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }
        .status-paid { background: #d1fae5; color: #065f46; }
        .status-partial { background: #fef3c7; color: #92400e; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } body { background: white !important; } }
        .print-only { display: none; }
        .lang-hi { font-family: 'Noto Sans Devanagari', sans-serif; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
        .badge-tailor { background: #dbeafe; color: #1e40af; }
        .badge-grocery { background: #d1fae5; color: #065f46; }
        .badge-business { background: #fef3c7; color: #92400e; }
        .modal-scroll { scrollbar-width: thin; }
        .modal-scroll::-webkit-scrollbar { width: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .card-hover { transition: all 0.3s ease; cursor: pointer; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.1); }
        .glassmorphism { background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .animate-pulse-slow { animation: pulse 3s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .gradient-text { background: linear-gradient(135deg, #4f46e5, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .bg-gradient-primary { background: linear-gradient(135deg, #4f46e5, #7c3aed); }

            ORDERS: 'saas_orders',

            ACTIVITY_LOGS: 'saas_activity_logs',
            APP_STATE: 'saas_app_state',
            SETTINGS: 'saas_settings',
            EXPENSES: 'saas_expenses',
            INVENTORY: 'saas_inventory',
            EMPLOYEES: 'saas_employees',

        class StorageManager {
            constructor(key) { this.key = key; }
            getAll() { try { const data = localStorage.getItem(this.key); return data ? JSON.parse(data) : []; } catch { return []; } }
            getById(id) { return this.getAll().find(item => item.id === id) || null; }
            create(item) { const items = this.getAll(); const newItem = { ...item, id: this._generateId() }; items.push(newItem);
                this._save(items); return newItem; }
            update(id, updates) { const items = this.getAll(); const index = items.findIndex(item => item.id === id); if (index ===
                    -1) return null; items[index] = { ...items[index], ...updates, updatedAt: new Date().toISOString() };
                this._save(items); return items[index]; }
            delete(id) { const items = this.getAll(); const filtered = items.filter(item => item.id !== id); if (filtered.length ===
                    items.length) return false; this._save(filtered); return true; }
            getByShopId(shopId) { return this.getAll().filter(item => item.shopId === shopId); }
            _save(items) { try { localStorage.setItem(this.key, JSON.stringify(items)); } catch (e) { console.error('Storage error:',
                        e); } }
            _generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
        }

        const shopStorage = new StorageManager(STORAGE_KEYS.SHOPS);
        const userStorage = new StorageManager(STORAGE_KEYS.USERS);
        const customerStorage = new StorageManager(STORAGE_KEYS.CUSTOMERS);
        const orderStorage = new StorageManager(STORAGE_KEYS.ORDERS);
        const paymentStorage = new StorageManager(STORAGE_KEYS.PAYMENTS);
        const activityStorage = new StorageManager(STORAGE_KEYS.ACTIVITY_LOGS);
        const expenseStorage = new StorageManager(STORAGE_KEYS.EXPENSES);
        const inventoryStorage = new StorageManager(STORAGE_KEYS.INVENTORY);
        const employeeStorage = new StorageManager(STORAGE_KEYS.EMPLOYEES);
        const supplierStorage = new StorageManager(STORAGE_KEYS.SUPPLIERS);
        const notificationStorage = new StorageManager(STORAGE_KEYS.NOTIFICATIONS);
        const appointmentStorage = new StorageManager(STORAGE_KEYS.APPOINTMENTS);
        const loyaltyStorage = new StorageManager(STORAGE_KEYS.LOYALTY);

        const appStateStorage = {
            getState() { try { const data = localStorage.getItem(STORAGE_KEYS.APP_STATE); return data ? JSON.parse(data) : {
                        currentShopId: null, currentUser: null }; } catch { return { currentShopId: null, currentUser: null }; } },
            setState(state) { const current = this.getState(); const updated = { ...current, ...state };
                localStorage.setItem(STORAGE_KEYS.APP_STATE, JSON.stringify(updated)); },
            clear() { localStorage.removeItem(STORAGE_KEYS.APP_STATE); }
        };

        const settingsStorage = {
            get() { try { const data = localStorage.getItem(STORAGE_KEYS.SETTINGS); return data ? JSON.parse(data) : { language: 'en',
                        currency: '₹', dateFormat: 'DD/MM/YYYY' }; } catch { return { language: 'en', currency: '₹',
                        dateFormat: 'DD/MM/YYYY' }; } },
            set(settings) { localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(settings)); }
        };

        // ============================================================
        // 2. HELPERS
        // ============================================================
        function generateOrderNumber(shopId) {
            const orders = orderStorage.getByShopId(shopId);
            const count = orders.length + 1;
            const d = new Date();
            const year = d.getFullYear().toString().slice(-2);
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            return `ORD-${year}${month}-${count.toString().padStart(4, '0')}`;
        }

        function logActivity(shopId, userId, action, details) {
            activityStorage.create({ shopId, userId, action, details, timestamp: new Date().toISOString() });
        }

        function getCustomerByMobile(mobile, shopId) {
            return customerStorage.getByShopId(shopId).find(c => c.mobile === mobile) || null;
        }

        function searchCustomers(query, shopId) {
            const q = query.toLowerCase();
            return customerStorage.getByShopId(shopId).filter(c =>
                c.name.toLowerCase().includes(q) ||
                c.mobile.includes(query) ||
                (c.email && c.email.toLowerCase().includes(q))
            );
        }

        function formatCurrency(amount) {
            const settings = settingsStorage.get();
            return settings.currency + ' ' + Number(amount).toLocaleString('en-IN');
        }

        function formatDate(date) {
            const d = new Date(date);
            const settings = settingsStorage.get();
            if (settings.dateFormat === 'MM/DD/YYYY') {
                return (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getDate().toString().padStart(2, '0') + '/' + d
                    .getFullYear();
            } else if (settings.dateFormat === 'YYYY/MM/DD') {
                return d.getFullYear() + '/' + (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getDate().toString()
                    .padStart(2, '0');
            }
            return d.getDate().toString().padStart(2, '0') + '/' + (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d
                .getFullYear();
        }

        // 5. HASH-BASED ROUTER
        // ============================================================
        let currentRoute = '/login';
        const routerListeners = [];

        function getRouteFromHash() {
            const hash = window.location.hash.slice(1) || '/';
            return hash;
        }

        function navigate(route) {
            if (!route.startsWith('/')) route = '/' + route;
            currentRoute = route;
            window.location.hash = route;
            routerListeners.forEach(fn => fn());
            // Scroll to top
            window.scrollTo(0, 0);
        }

        function onRouteChange(fn) {
            routerListeners.push(fn);
            return () => { routerListeners = routerListeners.filter(f => f !== fn); };
        }

        window.addEventListener('hashchange', () => {
            currentRoute = getRouteFromHash();
            routerListeners.forEach(fn => fn());
        });

        // ============================================================
        // 6. REACT-LIKE RENDER ENGINE
        // ============================================================
        let appState = appStateStorage.getState();
        let appListeners = [];

        function setAppState(newState) {
            appState = { ...appState, ...newState };
            appStateStorage.setState(appState);
            appListeners.forEach(fn => fn());
        }

        function subscribe(listener) {
            appListeners.push(listener);
            return () => { appListeners = appListeners.filter(fn => fn !== listener); };
        }

        function rerender() {
            clearTimeout(window._rerenderTimeout);
            window._rerenderTimeout = setTimeout(() => {
                renderRoute();
            }, 10);
        }

            `;
            btn.onclick = (e) => { e.stopPropagation();

            container.appendChild(btn);

                dropdown.className =

                        rerender(); };

                    for (let i = 6; i >= 0; i--) {

                        d.setDate(d.getDate() - i);
                        last7Days.push(d.toLocaleDateString('en-IN', { weekday: 'short' }));
                        const dayOrders = orders.filter(o => new Date(o.createdAt).toDateString() === d.toDateString());

                    const statusCounts = {
                        pending: orders.filter(o => o.status === 'pending').length,
                        'in-progress': orders.filter(o => o.status === 'in-progress').length,
                        ready: orders.filter(o => o.status === 'ready').length,
                        delivered: orders.filter(o => o.status === 'delivered').length,
                        cancelled: orders.filter(o => o.status === 'cancelled').length,

                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Pending', 'In Progress', 'Ready', 'Delivered', 'Cancelled'],
                            datasets: [{
                                data: [statusCounts.pending, statusCounts['in-progress'], statusCounts.ready, statusCounts

                                backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#6b7280', '#ef4444'],
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                }

            orders.forEach(o => {

            const topCustomers = Object.entries(customerSpending)
                .sort((a, b) => b[1] - a[1])

                    const description = document.getElementById('expDescription').value.trim();

        // ============================================================
        // 10. ROUTER
        // ============================================================
        function renderRoute() {
            const route = currentRoute;

            const isLoggedIn = appState.currentUser && appState.currentShopId;
            const publicRoutes = ['/login'];

            if (!isLoggedIn && !publicRoutes.includes(route)) {
                navigate('/login');
                return renderPage(LoginPage);
            }

            if (isLoggedIn && route === '/login') {
                navigate('/dashboard');
                return renderRoute();
            }

            let page;
            switch (route) {
                case '/dashboard':
                    page = DashboardPage();
                    break;
                case '/analytics':
                    page = AnalyticsPage();
                    break;
                case '/customers':
                    page = CustomersPage();
                    break;
                case '/orders':
                    page = createPlaceholderPage(t('orders'), 'fa-box', 'Manage all your orders, track status, and generate invoices.');
                    break;
                case '/payments':
                    page = createPlaceholderPage(t('payments'), 'fa-credit-card', 'Track all payments, manage receipts, and reconcile accounts.');
                    break;
                case '/finance':
                    page = FinancePage();
                    break;
                case '/inventory':
                    page = createPlaceholderPage(t('inventory'), 'fa-cubes', 'Manage your inventory, track stock levels, and handle suppliers.');
                    break;
                case '/crm':
                    page = createPlaceholderPage(t('crm'), 'fa-handshake', 'Customer relationship management with loyalty points, history, and engagement.');
                    break;
                case '/employees':
                    page = createPlaceholderPage(t('employees'), 'fa-user-tie', 'Employee management with attendance, salary, and performance tracking.');
                    break;
                case '/calendar':
                    page = createPlaceholderPage(t('calendar'), 'fa-calendar', 'Manage appointments, deadlines, and reminders all in one place.');
                    break;
                case '/reports':
                    page = createPlaceholderPage(t('reports'), 'fa-file-alt', 'Generate comprehensive reports, export to PDF/Excel, and analyze data.');
                    break;
                case '/notifications':
                    page = createPlaceholderPage(t('notifications'), 'fa-bell', 'Stay updated with real-time notifications, alerts, and reminders.');
                    break;
                case '/settings':
                    page = SettingsPage();
                    break;
                case '/login':
                    page = LoginPage();
                    break;
                default:
                    page = NotFoundPage();
            }

            if (isLoggedIn && route !== '/login') {
                const titles = {
                    '/dashboard': t('dashboard'),
                    '/analytics': t('analytics'),
                    '/customers': t('customers'),
                    '/orders': t('orders'),
                    '/payments': t('payments'),
                    '/finance': t('finance'),
                    '/inventory': t('inventory'),
                    '/crm': t('crm'),
                    '/employees': t('employees'),
                    '/calendar': t('calendar'),
                    '/reports': t('reports'),
                    '/notifications': t('notifications'),
                    '/settings': t('settings'),
                };
                const layout = Layout({ children: page, title: titles[route] || 'Page' });
                return renderPage(() => layout);
            }

            return renderPage(() => page);
        }

        function renderPage(component) {
            const app = document.getElementById('app');
            app.innerHTML = '';
            const el = component();
            app.appendChild(el);
            return el;
        }

        // ============================================================
        // 11. GLOBAL FUNCTIONS
        // ============================================================
        window.handleLogout = function() {
            appStateStorage.clear();
            appState = { currentShopId: null, currentUser: null };
            navigate('/login');
            rerender();
        };

        window.navigate = navigate;

        // 12. INIT
        // ============================================================
        subscribe(() => { rerender(); });
        onRouteChange(() => { rerender(); });

        currentRoute = getRouteFromHash();
        if (currentRoute === '/') currentRoute = '/login';

        const savedState = appStateStorage.getState();
        if (savedState.currentUser && savedState.currentShopId) {
            appState = savedState;
            if (currentRoute === '/login') {
                currentRoute = '/dashboard';
                window.location.hash = '/dashboard';
            }
        }

        renderRoute();

        console.log('🚀 ProSaaS Business Management Suite loaded!');

        console.log('👤 Demo: admin@prosaas.com / admin123');

        console.log('📊 Features: Analytics, Finance, Inventory, CRM, Employees, Calendar, Reports, Notifications');
        console.log('🌐 Language switcher available in Settings');
        console.log('✅ Professional SaaS platform ready!');

        // ============================================================
        // 13. AUTO-SEED ON FIRST RUN

        if (shopStorage.getAll().length === 0) {
            setTimeout(() => {
                if (confirm('🚀 Welcome to ProSaaS!\n\nNo data found. Would you like to seed demo data?')) {
                    seedMockData();
                    rerender();
                }
            }, 500);
        }
