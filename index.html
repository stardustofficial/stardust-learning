<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Tenant SaaS Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* Custom styles */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

        .sidebar-transition {

        .status-badge {

            border-radius: 9999px;

        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-in-progress { background: #dbeafe; color: #1e40af; }
        .status-ready { background: #d1fae5; color: #065f46; }
        .status-delivered { background: #f3f4f6; color: #374151; }

        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }

        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ============================================================
        // 1. TYPES & SCHEMA
        // ============================================================
        const STORAGE_KEYS = {
            SHOPS: 'saas_shops',
            USERS: 'saas_users',
            CUSTOMERS: 'saas_customers',
            ORDERS: 'saas_orders',
            PAYMENTS: 'saas_payments',
            ACTIVITY_LOGS: 'saas_activity_logs',
            APP_STATE: 'saas_app_state',
        };

        // ============================================================
        // 2. STORAGE MANAGER (Generic CRUD)
        // ============================================================
        class StorageManager {
            constructor(key) {
                this.key = key;
            }

            getAll() {
                try {
                    const data = localStorage.getItem(this.key);
                    return data ? JSON.parse(data) : [];
                } catch {
                    return [];
                }
            }

            getById(id) {
                return this.getAll().find(item => item.id === id) || null;
            }

            create(item) {
                const items = this.getAll();
                const newItem = { ...item, id: this._generateId() };
                items.push(newItem);
                this._save(items);
                return newItem;
            }

            update(id, updates) {
                const items = this.getAll();
                const index = items.findIndex(item => item.id === id);
                if (index === -1) return null;
                items[index] = { ...items[index], ...updates, updatedAt: new Date().toISOString() };
                this._save(items);
                return items[index];
            }

            delete(id) {
                const items = this.getAll();
                const filtered = items.filter(item => item.id !== id);
                if (filtered.length === items.length) return false;
                this._save(filtered);
                return true;
            }

            getByShopId(shopId) {
                return this.getAll().filter(item => item.shopId === shopId);
            }

            _save(items) {
                try {
                    localStorage.setItem(this.key, JSON.stringify(items));
                } catch (e) {
                    console.error('Storage error:', e);
                }
            }

            _generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
            }
        }

        // ============================================================
        // 3. STORAGE INSTANCES
        // ============================================================
        const shopStorage = new StorageManager(STORAGE_KEYS.SHOPS);
        const userStorage = new StorageManager(STORAGE_KEYS.USERS);
        const customerStorage = new StorageManager(STORAGE_KEYS.CUSTOMERS);
        const orderStorage = new StorageManager(STORAGE_KEYS.ORDERS);
        const paymentStorage = new StorageManager(STORAGE_KEYS.PAYMENTS);
        const activityStorage = new StorageManager(STORAGE_KEYS.ACTIVITY_LOGS);

        const appStateStorage = {
            getState() {
                try {
                    const data = localStorage.getItem(STORAGE_KEYS.APP_STATE);
                    return data ? JSON.parse(data) : { currentShopId: null, currentUser: null };
                } catch {
                    return { currentShopId: null, currentUser: null };
                }
            },
            setState(state) {
                const current = this.getState();
                const updated = { ...current, ...state };
                localStorage.setItem(STORAGE_KEYS.APP_STATE, JSON.stringify(updated));
            },
            clear() {
                localStorage.removeItem(STORAGE_KEYS.APP_STATE);
            }
        };

        // ============================================================
        // 4. HELPER FUNCTIONS
        // ============================================================
        function generateOrderNumber(shopId) {
            const orders = orderStorage.getByShopId(shopId);
            const count = orders.length + 1;
            const d = new Date();
            const year = d.getFullYear().toString().slice(-2);
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            return `ORD-${year}${month}-${count.toString().padStart(4, '0')}`;
        }

        function calculateRemainingAmount(order) {
            const payments = paymentStorage.getAll().filter(p => p.orderId === order.id);
            const totalPaid = payments.reduce((sum, p) => sum + p.amount, 0);
            return order.totalAmount - totalPaid;
        }

        function logActivity(shopId, userId, action, details) {
            activityStorage.create({
                shopId,
                userId,
                action,
                details,
                timestamp: new Date().toISOString(),
            });
        }

        function getCustomerByMobile(mobile, shopId) {
            return customerStorage.getByShopId(shopId).find(c => c.mobile === mobile) || null;
        }

        function searchCustomers(query, shopId) {
            const q = query.toLowerCase();
            return customerStorage.getByShopId(shopId).filter(c =>
                c.name.toLowerCase().includes(q) ||
                c.mobile.includes(query) ||
                (c.email && c.email.toLowerCase().includes(q))
            );
        }

        // ============================================================
        // 6. REACT-LIKE RENDER ENGINE (Mini Framework)
        // ============================================================
        let appState = appStateStorage.getState();
        let appListeners = [];

        function setAppState(newState) {
            appState = { ...appState, ...newState };
            appStateStorage.setState(appState);
            appListeners.forEach(fn => fn());
        }

        function subscribe(listener) {
            appListeners.push(listener);
            return () => { appListeners = appListeners.filter(fn => fn !== listener); };
        }

        function render(component, container) {
            container.innerHTML = '';
            const el = component();
            container.appendChild(el);
            return el;
        }

        function h(tag, props = {}, ...children) {
            const el = document.createElement(tag);
            for (const [key, value] of Object.entries(props || {})) {
                if (key === 'className') {
                    el.className = value;
                } else if (key === 'style' && typeof value === 'object') {
                    Object.assign(el.style, value);
                } else if (key.startsWith('on') && typeof value === 'function') {
                    el.addEventListener(key.slice(2).toLowerCase(), value);
                } else if (key === 'dangerouslySetInnerHTML') {
                    el.innerHTML = value.__html;
                } else if (key === 'value' || key === 'checked') {
                    el[key] = value;
                } else if (key === 'ref' && typeof value === 'function') {
                    value(el);
                } else {
                    el.setAttribute(key, value);
                }
            }
            for (const child of children) {
                if (child === null || child === undefined) continue;
                if (typeof child === 'string' || typeof child === 'number') {
                    el.appendChild(document.createTextNode(String(child)));
                } else if (Array.isArray(child)) {
                    child.forEach(c => {
                        if (c) el.appendChild(c);
                    });
                } else {
                    el.appendChild(child);
                }
            }
            return el;
        }

        // Simple router
        let currentRoute = '/login';
        const routerListeners = [];

        function navigate(route) {
            currentRoute = route;
            routerListeners.forEach(fn => fn());
            window.history.pushState({}, '', route);
        }

        function onRouteChange(fn) {
            routerListeners.push(fn);
            return () => { routerListeners = routerListeners.filter(f => f !== fn); };
        }

        window.addEventListener('popstate', () => {
            currentRoute = window.location.pathname;
            routerListeners.forEach(fn => fn());
        });

        // ============================================================
        // 7. COMPONENTS
        // ============================================================

        // ---- Shop Switcher ----
        function ShopSwitcher() {
            const shops = shopStorage.getAll();
            const currentShop = shops.find(s => s.id === appState.currentShopId);

            let isOpen = false;
            let showCreateModal = false;

            function renderCreateModal() {
                const overlay = document.createElement('div');
                overlay.className = 'fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4';
                overlay.innerHTML = `
                    <div class="bg-white rounded-xl w-full max-w-md p-6">
                        <h2 class="text-xl font-bold text-gray-900 mb-4">Create New Shop</h2>
                        <form id="createShopForm">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Shop Name *</label>
                                    <input type="text" id="shopName" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="Enter shop name">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Address *</label>
                                    <textarea id="shopAddress" required rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="Enter shop address"></textarea>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone *</label>
                                    <input type="tel" id="shopPhone" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="Enter phone number">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                    <input type="email" id="shopEmail" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="Enter email address">
                                </div>
                                <div class="flex space-x-3 pt-4">
                                    <button type="button" onclick="this.closest('.fixed').remove()" class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">Cancel</button>
                                    <button type="submit" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Create Shop</button>
                                </div>
                            </div>
                        </form>
                    </div>
                `;
                document.body.appendChild(overlay);

                document.getElementById('createShopForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    const name = document.getElementById('shopName').value.trim();
                    const address = document.getElementById('shopAddress').value.trim();
                    const phone = document.getElementById('shopPhone').value.trim();
                    const email = document.getElementById('shopEmail').value.trim();
                    if (name && address && phone) {
                        const shop = shopStorage.create({
                            name,
                            address,
                            phone,
                            email,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString(),
                        });
                        setAppState({ currentShopId: shop.id });
                        overlay.remove();
                        rerender();
                    }
                });
            }

            const container = document.createElement('div');
            container.className = 'relative';

            const btn = document.createElement('button');
            btn.className =
                'flex items-center space-x-2 px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors text-sm';
            btn.innerHTML = `
                <i class="fas fa-store text-gray-600"></i>
                <span class="font-medium text-gray-700">${currentShop?.name || 'Select Shop'}</span>
                <i class="fas fa-chevron-down text-gray-400 text-xs"></i>
            `;
            btn.onclick = () => {
                isOpen = !isOpen;
                rerender();
            };
            container.appendChild(btn);

            if (isOpen) {
                const dropdown = document.createElement('div');
                dropdown.className = 'absolute top-full left-0 mt-1 w-64 bg-white rounded-lg shadow-lg border border-gray-200 z-20';
                const list = document.createElement('div');
                list.className = 'p-2';

                shops.forEach(shop => {
                    const item = document.createElement('button');
                    item.className =
                        `w-full flex items-center space-x-2 px-3 py-2 rounded-lg text-sm transition-colors ${shop.id === appState.currentShopId ? 'bg-indigo-50 text-indigo-700' : 'hover:bg-gray-100 text-gray-700'}`;
                    item.innerHTML = `
                        <i class="fas fa-building"></i>
                        <span class="flex-1 text-left">${shop.name}</span>
                        ${shop.id === appState.currentShopId ? '<span class="text-xs text-indigo-600">Active</span>' : ''}
                    `;
                    item.onclick = () => {
                        setAppState({ currentShopId: shop.id });
                        isOpen = false;
                        rerender();
                    };
                    list.appendChild(item);
                });

                const divider = document.createElement('div');
                divider.className = 'border-t border-gray-200 mt-2 pt-2';
                list.appendChild(divider);

                const createBtn = document.createElement('button');
                createBtn.className =
                    'w-full flex items-center space-x-2 px-3 py-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors text-sm';
                createBtn.innerHTML = `<i class="fas fa-plus"></i><span>Create New Shop</span>`;
                createBtn.onclick = () => {
                    isOpen = false;
                    renderCreateModal();
                    rerender();
                };
                list.appendChild(createBtn);

                dropdown.appendChild(list);

                // Close on outside click
                const closeHandler = (e) => {
                    if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                        isOpen = false;
                        rerender();
                        document.removeEventListener('click', closeHandler);
                    }
                };
                setTimeout(() => document.addEventListener('click', closeHandler), 0);

                container.appendChild(dropdown);
            }

            return container;
        }

        // ---- Layout ----
        function Layout({ children, title = 'Dashboard' }) {
            const currentUser = appState.currentUser;
            const isMobileMenuOpen = false;

            const navItems = [
                { name: 'Dashboard', href: '/dashboard', icon: 'fa-gauge-high' },
                { name: 'Customers', href: '/customers', icon: 'fa-users' },
                { name: 'Orders', href: '/orders', icon: 'fa-box' },
                { name: 'Payments', href: '/payments', icon: 'fa-credit-card' },
                { name: 'Settings', href: '/settings', icon: 'fa-gear' },
            ];

            const restricted = {
                owner: [],
                manager: ['/settings'],
                cashier: ['/settings', '/customers'],
                worker: ['/dashboard', '/orders'],
                delivery: ['/dashboard', '/orders'],
            };

            const allowed = navItems.filter(item =>
                !(restricted[currentUser?.role] || []).includes(item.href)
            );

            const container = document.createElement('div');
            container.className = 'min-h-screen bg-gray-100';

            // Mobile header
            const mobileHeader = document.createElement('div');
            mobileHeader.className = 'lg:hidden bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between';

                <button id="mobileMenuToggle" class="text-gray-600 hover:text-gray-900"><i class="fas fa-bars text-xl"></i></button>
                <h1 class="text-lg font-semibold text-gray-900">SaaS Manager</h1>
                <div class="flex items-center space-x-3">
                    <div id="mobileShopSwitcher"></div>
                    <i class="fas fa-user-circle text-2xl text-gray-600"></i>
                </div>
            `;
            container.appendChild(mobileHeader);

            // Main flex
            const flex = document.createElement('div');
            flex.className = 'flex';

            // Sidebar
            const sidebar = document.createElement('aside');
            sidebar.className =
                'fixed top-0 left-0 z-40 w-64 h-full bg-white border-r border-gray-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-300';
            sidebar.id = 'sidebar';

            sidebar.innerHTML = `
                <div class="flex flex-col h-full">
                    <div class="p-6 border-b border-gray-200">
                        <h1 class="text-xl font-bold text-indigo-600">SaaS Manager</h1>
                        <p class="text-xs text-gray-500 mt-1">Multi-Tenant Management</p>
                    </div>
                    <div class="p-4 border-b border-gray-200">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center">
                                <span class="text-indigo-600 font-semibold">${currentUser?.name?.charAt(0) || 'U'}</span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium text-gray-900 truncate">${currentUser?.name || 'Guest'}</p>
                                <p class="text-xs text-gray-500 capitalize">${currentUser?.role || 'No Role'}</p>
                            </div>
                        </div>
                        <div class="mt-2" id="sidebarShopSwitcher"></div>
                    </div>
                    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                        ${allowed.map(item => `
                            <a href="${item.href}" class="flex items-center px-4 py-2.5 rounded-lg transition-colors ${window.location.pathname === item.href ? 'bg-indigo-50 text-indigo-700' : 'text-gray-700 hover:bg-gray-100'}">
                                <i class="fas ${item.icon} w-5"></i>
                                <span class="ml-3">${item.name}</span>
                            </a>
                        `).join('')}
                    </nav>
                    <div class="p-4 border-t border-gray-200">
                        <button onclick="handleLogout()" class="flex items-center w-full px-4 py-2.5 text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                            <i class="fas fa-sign-out-alt w-5"></i>
                            <span class="ml-3">Logout</span>
                        </button>
                    </div>
                </div>
            `;
            flex.appendChild(sidebar);

            // Main content
            const main = document.createElement('main');
            main.className = 'flex-1 min-w-0 p-6';
            main.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-900">${title}</h1>
                </div>
                <div id="pageContent"></div>
            `;
            flex.appendChild(main);
            container.appendChild(flex);

            // Mount shop switchers
            setTimeout(() => {
                const mobileSS = document.getElementById('mobileShopSwitcher');
                const sidebarSS = document.getElementById('sidebarShopSwitcher');
                if (mobileSS) {
                    const ss = ShopSwitcher();
                    mobileSS.appendChild(ss);
                }
                if (sidebarSS) {
                    const ss = ShopSwitcher();
                    sidebarSS.appendChild(ss);
                }

                // Mobile menu toggle
                const toggle = document.getElementById('mobileMenuToggle');
                if (toggle) {
                    toggle.onclick = () => {
                        const sb = document.getElementById('sidebar');
                        sb.classList.toggle('translate-x-0');
                        sb.classList.toggle('-translate-x-full');
                    };
                }

                // Close sidebar on nav click (mobile)
                document.querySelectorAll('#sidebar nav a').forEach(a => {
                    a.addEventListener('click', () => {
                        if (window.innerWidth < 1024) {
                            const sb = document.getElementById('sidebar');
                            sb.classList.add('-translate-x-full');
                            sb.classList.remove('translate-x-0');
                        }
                    });
                });
            }, 0);

            // Mount page content
            setTimeout(() => {
                const content = document.getElementById('pageContent');

                                    </button>
                                    <button type="submit" class="flex-1 px-4 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">

                    `;

                    overlay.innerHTML = html;

                    // Populate delivery date
                    const deliveryInput = document.getElementById('ofDelivery');
                    if (deliveryInput) {
                        deliveryInput.value = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                    }

                    // Customer select - auto-fill address
                    document.getElementById('ofCustomer')?.addEventListener('change', function() {
                        const customer = customers.find(c => c.id === this.value);
                        if (customer && customer.address) {
                            document.getElementById('ofAddress').value = customer.address;
                        }
                    });

                    // Add item
                    document.getElementById('ofAddItem')?.addEventListener('click', function() {
                        const name = document.getElementById('ofItemName').value.trim();
                        const qty = parseInt(document.getElementById('ofItemQty').value) || 1;
                        const price = parseFloat(document.getElementById('ofItemPrice').value) || 0;
                        if (name && qty > 0 && price > 0) {
                            const item = { id: Date.now().toString(), name, quantity: qty, price, total: qty * price };
                            formState.items.push(item);
                            formState.totalAmount += item.total;
                            updateItemsUI();
                            document.getElementById('ofItemName').value = '';
                            document.getElementById('ofItemPrice').value = '';
                            document.getElementById('ofTotal').value = formState.totalAmount;
                        }
                    });

                    function updateItemsUI() {
                        const list = document.getElementById('ofItemsList');
                        if (!list) return;
                        list.innerHTML = formState.items.map(item => `
                            <div class="bg-gray-100 rounded-lg px-3 py-1.5 flex items-center space-x-2 text-sm">
                                <span>${item.name} × ${item.quantity} = ₹${item.total}</span>
                                <button type="button" onclick="removeItem('${item.id}')" class="text-red-500 hover:text-red-700">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        `).join('');
                    }

                    window.removeItem = function(id) {
                        const item = formState.items.find(i => i.id === id);
                        if (item) {
                            formState.totalAmount -= item.total;
                            formState.items = formState.items.filter(i => i.id !== id);
                            updateItemsUI();
                            document.getElementById('ofTotal').value = formState.totalAmount;
                        }
                    };

                    // Form submit
                    document.getElementById('orderForm')?.addEventListener('submit', function(e) {
                        e.preventDefault();

                        const customerId = document.getElementById('ofCustomer').value;
                        const category = document.getElementById('ofCategory').value;
                        const subCategory = document.getElementById('ofSubCategory').value;
                        const specs = document.getElementById('ofSpecs').value;
                        const advance = parseFloat(document.getElementById('ofAdvance').value) || 0;
                        const total = parseFloat(document.getElementById('ofTotal').value) || 0;
                        const delivery = document.getElementById('ofDelivery').value;
                        const address = document.getElementById('ofAddress').value;

                        if (!customerId || !delivery || formState.items.length === 0) {
                            alert('Please fill in all required fields and add at least one item');
                            return;
                        }

                        const measurements = {};
                        document.querySelectorAll('.measurement-input').forEach(inp => {
                            if (inp.value.trim()) {
                                measurements[inp.dataset.key] = inp.value.trim();
                            }
                        });

                        const orderData = {
                            customerId,
                            shopId: appState.currentShopId,
                            category,
                            subCategory,
                            measurements,
                            specifications: specs,
                            advancePayment: advance,
                            totalAmount: total,
                            items: formState.items,
                            status: 'pending',
                            targetDeliveryDate: delivery,
                            deliveryAddress: address || 'N/A',
                            createdBy: appState.currentUser?.id || '',
                            remainingAmount: total - advance,
                            paymentStatus: advance >= total ? 'paid' : 'pending',
                            orderNumber: generateOrderNumber(appState.currentShopId),
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString(),
                        };

                        const order = orderStorage.create(orderData);

                        if (advance > 0) {
                            paymentStorage.create({
                                orderId: order.id,
                                amount: advance,
                                method: 'cash',
                                receivedBy: appState.currentUser?.id || '',
                                createdAt: new Date().toISOString(),
                            });
                        }

                        logActivity(appState.currentShopId, appState.currentUser?.id || '', 'order_created',
                            `Order ${order.orderNumber} created`);

                        document.getElementById('orderFormModal').remove();
                        rerender();
                    });
                }

                renderForm();
                document.body.appendChild(overlay);
                return overlay;
            }

                            <span>New Order</span>
                        </button>
                        <button onclick="navigate('/customers')" class="flex items-center space-x-2 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">

                    </div>
                    <div class="overflow-x-auto">
                        ${renderOrders()}
                    </div>
                </div>
            `;

            setTimeout(() => {
                document.getElementById('newOrderBtn')?.addEventListener('click', function() {
                    renderOrderForm();
                });
            }, 0);

            return container;
        }

                                        <input type="file" id="photoInput" accept="image/*" class="hidden">

                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                                <input type="text" id="cfName" required value="${c.name || ''}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number *</label>
                                <input type="tel" id="cfMobile" required value="${c.mobile || ''}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="+91 98765 43210">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                                <textarea id="cfAddress" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">${c.address || ''}</textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                                <input type="email" id="cfEmail" value="${c.email || ''}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="customer@example.com">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">GST Number</label>
                                <input type="text" id="cfGst" value="${c.gstNumber || ''}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="GSTIN22AABCG1234P1Z">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Internal Notes</label>
                                <textarea id="cfNotes" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">${c.notes || ''}</textarea>
                            </div>
                            <div class="flex space-x-3 pt-4 border-t border-gray-200">
                                <button type="button" onclick="document.getElementById('customerFormModal').remove()" class="flex-1 px-4 py-2.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium">Cancel</button>
                                <button type="submit" class="flex-1 px-4 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">${isEdit ? 'Update Customer' : 'Add Customer'}</button>
                            </div>
                        </form>
                    </div>
                `;

                document.body.appendChild(overlay);

                // Photo upload
                document.getElementById('photoInput')?.addEventListener('change', function(e) {
                    const file = e.target.files?.[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onloadend = function() {
                            const preview = document.querySelector('#customerFormModal .w-20.h-20 img');
                            if (preview) {
                                preview.src = reader.result;
                            } else {
                                const container = document.querySelector('#customerFormModal .w-20.h-20');
                                if (container) {
                                    container.innerHTML = `<img src="${reader.result}" alt="Preview" class="w-full h-full object-cover">`;
                                }
                            }
                            // Store for form submission
                            window._photoData = reader.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });

                // Form submit
                document.getElementById('customerForm')?.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const name = document.getElementById('cfName').value.trim();
                    const mobile = document.getElementById('cfMobile').value.trim();
                    const address = document.getElementById('cfAddress').value.trim();
                    const email = document.getElementById('cfEmail').value.trim();
                    const gstNumber = document.getElementById('cfGst').value.trim();
                    const notes = document.getElementById('cfNotes').value.trim();
                    const photo = window._photoData || c.photo || '';

                    if (!name || !mobile) {
                        alert('Name and Mobile are required');
                        return;
                    }

                    // Check duplicate mobile
                    const existing = getCustomerByMobile(mobile, shopId);
                    if (existing && existing.id !== c.id) {
                        alert('A customer with this mobile number already exists');
                        return;
                    }

                    const data = { name, mobile, address, email, gstNumber, notes, photo, shopId };

                    if (isEdit) {
                        customerStorage.update(c.id, data);
                    } else {
                        customerStorage.create({
                            ...data,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString(),
                        });
                        logActivity(shopId, appState.currentUser?.id || '', 'customer_created', `Customer ${name} created`);
                    }

                    document.getElementById('customerFormModal').remove();
                    rerender();
                });
            }

            // Global functions for inline actions
            window.editCustomer = function(id) {
                editingCustomer = customerStorage.getById(id);
                showForm = true;
                renderForm();
            };

            window.deleteCustomer = function(id) {
                if (confirm('Are you sure you want to delete this customer?')) {
                    customerStorage.delete(id);
                    rerender();
                }
            };

            const container = document.createElement('div');
            container.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 space-y-4 sm:space-y-0">
                    <h1 class="text-2xl font-bold text-gray-900">Customers</h1>
                    <button id="addCustomerBtn" class="flex items-center space-x-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                        <i class="fas fa-plus"></i>
                        <span>Add Customer</span>
                    </button>
                </div>

                <div class="mb-6">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput" value="${searchQuery}" placeholder="Search customers by name, phone, or email..." 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div id="customersGrid">
                    ${renderCustomers()}
                </div>
            `;

            setTimeout(() => {
                document.getElementById('addCustomerBtn')?.addEventListener('click', function() {
                    editingCustomer = null;
                    showForm = true;
                    window._photoData = null;
                    renderForm();
                });

                document.getElementById('searchInput')?.addEventListener('input', function() {
                    searchQuery = this.value;
                    const grid = document.getElementById('customersGrid');
                    if (grid) {
                        const filtered = searchQuery ?
                            searchCustomers(searchQuery, shopId) :
                            customerStorage.getByShopId(shopId);
                        // Re-render just the grid
                        const container2 = document.createElement('div');
                        container2.innerHTML = renderCustomers();
                        grid.innerHTML = container2.innerHTML;
                    }
                });
            }, 0);

            return container;
        }

        // ---- Orders Page (placeholder) ----
        function OrdersPage() {
            const container = document.createElement('div');
            container.className = 'bg-white rounded-xl border border-gray-200 p-8 text-center';
            container.innerHTML = `
                <i class="fas fa-box text-5xl text-gray-300 mb-4"></i>
                <h2 class="text-xl font-semibold text-gray-900">Orders Management</h2>
                <p class="text-gray-500 mt-2">Full order management with filtering, status updates, and invoice generation coming soon.</p>
                <button onclick="navigate('/dashboard')" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                    Go to Dashboard
                </button>
            `;
            return container;
        }

        // ---- Payments Page (placeholder) ----
        function PaymentsPage() {
            const container = document.createElement('div');
            container.className = 'bg-white rounded-xl border border-gray-200 p-8 text-center';
            container.innerHTML = `
                <i class="fas fa-credit-card text-5xl text-gray-300 mb-4"></i>
                <h2 class="text-xl font-semibold text-gray-900">Payments Management</h2>
                <p class="text-gray-500 mt-2">Payment tracking, receipt generation, and financial reports coming soon.</p>
                <button onclick="navigate('/dashboard')" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                    Go to Dashboard
                </button>
            `;
            return container;
        }

        // ---- Settings Page (placeholder) ----
        function SettingsPage() {
            const container = document.createElement('div');
            container.className = 'bg-white rounded-xl border border-gray-200 p-8 text-center';
            container.innerHTML = `
                <i class="fas fa-gear text-5xl text-gray-300 mb-4"></i>
                <h2 class="text-xl font-semibold text-gray-900">Settings</h2>
                <p class="text-gray-500 mt-2">Shop settings, user management, and system preferences coming soon.</p>
                <button onclick="navigate('/dashboard')" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                    Go to Dashboard
                </button>
            `;
            return container;
        }

        // ---- 404 ----
        function NotFoundPage() {
            const container = document.createElement('div');
            container.className = 'min-h-screen bg-gray-100 flex items-center justify-center p-4';
            container.innerHTML = `
                <div class="text-center">
                    <h1 class="text-6xl font-bold text-gray-300">404</h1>
                    <p class="text-xl text-gray-600 mt-2">Page not found</p>
                    <button onclick="navigate('/dashboard')" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                        Go to Dashboard
                    </button>
                </div>
            `;
            return container;
        }

        // ============================================================
        // 8. ROUTER
        // ============================================================
        function getCurrentRoute() {
            const path = window.location.pathname;
            if (path === '/') return '/dashboard';
            return path || '/login';
        }

        function renderRoute() {
            const route = getCurrentRoute();

            // Check auth
            const isLoggedIn = appState.currentUser && appState.currentShopId;
            const publicRoutes = ['/login'];

            if (!isLoggedIn && !publicRoutes.includes(route)) {
                navigate('/login');
                return render(LoginPage, document.getElementById('app'));
            }

            if (isLoggedIn && route === '/login') {
                navigate('/dashboard');
                return renderRoute();
            }

            let page;
            switch (route) {
                case '/dashboard':
                    page = DashboardPage();
                    break;
                case '/customers':
                    page = CustomersPage();
                    break;
                case '/orders':
                    page = OrdersPage();
                    break;
                case '/payments':
                    page = PaymentsPage();
                    break;
                case '/settings':
                    page = SettingsPage();
                    break;
                case '/login':
                    page = LoginPage();
                    break;
                default:
                    page = NotFoundPage();
            }

            if (isLoggedIn && route !== '/login') {
                const titles = {
                    '/dashboard': 'Dashboard',
                    '/customers': 'Customers',
                    '/orders': 'Orders',
                    '/payments': 'Payments',
                    '/settings': 'Settings',
                };
                const layout = Layout({ children: page, title: titles[route] || 'Page' });
                return render(() => layout, document.getElementById('app'));
            }

            return render(() => page, document.getElementById('app'));
        }

        // ============================================================
        // 9. GLOBAL FUNCTIONS
        // ============================================================
        window.handleLogout = function() {
            appStateStorage.clear();
            appState = { currentShopId: null, currentUser: null };
            navigate('/login');
            rerender();
        };

        window.navigate = navigate;

        // ============================================================
        // 10. RERENDER & INIT
        // ============================================================
        let rerenderTimeout;

        function rerender() {
            clearTimeout(rerenderTimeout);
            rerenderTimeout = setTimeout(() => {
                renderRoute();
            }, 10);
        }

        // Subscribe to app state changes
        subscribe(() => {
            rerender();
        });

        // Route changes
        onRouteChange(() => {
            rerender();
        });

        // Handle initial route from URL
        const initialPath = window.location.pathname;
        if (initialPath && initialPath !== '/') {
            currentRoute = initialPath;
        } else {
            currentRoute = '/login';
        }

        // Check if user is already logged in
        const savedState = appStateStorage.getState();
        if (savedState.currentUser && savedState.currentShopId) {
            appState = savedState;
            if (currentRoute === '/login') {
                currentRoute = '/dashboard';
            }
        }

        // Initialize app
        renderRoute();

        console.log('🚀 Multi-Tenant SaaS Management App loaded successfully!');
        console.log('📦 Data stored in localStorage');
        console.log('👤 Demo: arjun@stardust.com / owner123');

        // ============================================================
        // 11. PRINT INVOICE HELPER (for future use)
        // ============================================================
        window.printInvoice = function(orderId) {
            const order = orderStorage.getById(orderId);
            if (!order) {
                alert('Order not found');
                return;
            }
            const customer = customerStorage.getById(order.customerId);
            const payments = paymentStorage.getAll().filter(p => p.orderId === orderId);
            const totalPaid = payments.reduce((s, p) => s + p.amount, 0);

            const printWindow = window.open('', '_blank', 'width=800,height=600');
            if (!printWindow) {
                alert('Please allow popups to print invoices');
                return;
            }

            printWindow.document.write(`
                <html>
                <head><title>Invoice ${order.orderNumber}</title>
                <style>
                    body { font-family: Arial, sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; }
                    .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 20px; }
                    .header h1 { margin: 0; color: #4f46e5; }
                    .details { display: flex; justify-content: space-between; margin: 20px 0; padding: 10px 0; }
                    .items { width: 100%; border-collapse: collapse; margin: 20px 0; }
                    .items th, .items td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
                    .items th { background: #f3f4f6; }
                    .totals { text-align: right; margin-top: 20px; }
                    .footer { text-align: center; margin-top: 40px; font-size: 12px; color: #666; border-top: 1px solid #ddd; padding-top: 20px; }
                </style>
                </head>
                <body>
                    <div class="header">
                        <h1>INVOICE</h1>
                        <p>${appState.currentShopId ? shopStorage.getById(appState.currentShopId)?.name || 'SaaS Shop' : 'SaaS Shop'}</p>
                        <p>Order #: ${order.orderNumber}</p>
                    </div>
                    <div class="details">
                        <div>
                            <strong>Customer:</strong> ${customer?.name || 'Unknown'}<br>
                            <strong>Mobile:</strong> ${customer?.mobile || 'N/A'}<br>
                            <strong>Address:</strong> ${customer?.address || 'N/A'}
                        </div>
                        <div>
                            <strong>Order Date:</strong> ${new Date(order.createdAt).toLocaleDateString()}<br>
                            <strong>Delivery Date:</strong> ${new Date(order.targetDeliveryDate).toLocaleDateString()}<br>
                            <strong>Status:</strong> ${order.status.toUpperCase()}
                        </div>
                    </div>
                    <h3>Order Items</h3>
                    <table class="items">
                        <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
                        <tbody>
                            ${(order.items || []).map(item => `
                                <tr><td>${item.name}</td><td>${item.quantity}</td><td>₹${item.price}</td><td>₹${item.total}</td></tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div class="totals">
                        <p><strong>Total Amount:</strong> ₹${order.totalAmount.toLocaleString()}</p>
                        <p><strong>Advance Paid:</strong> ₹${order.advancePayment.toLocaleString()}</p>
                        <p><strong>Remaining:</strong> ₹${(order.totalAmount - totalPaid).toLocaleString()}</p>
                    </div>
                    ${order.specifications ? `<p><strong>Specifications:</strong> ${order.specifications}</p>` : ''}
                    <div class="footer">
                        <p>Thank you for your business!</p>
                        <p>${new Date().toLocaleString()}</p>
                    </div>
                    <script>
                        window.print();
                        window.close();
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        };

        console.log('✅ App ready!');
    </script>
</body>
